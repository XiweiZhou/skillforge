[project]
name = "skillforge"
version = "0.1.0"
description = "Self-improving agents with closed-loop learning"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
claude = ["anthropic>=0.39.0"]
openai = ["openai>=1.0.0"]
deepseek = ["openai>=1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
